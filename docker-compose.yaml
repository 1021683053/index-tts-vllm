services:
  index-tts:
    build: .
    image: index-tts-server
    env_file:
      - .env.example
    container_name: index-tts-server
    ports:
      - "${PORT:-9009}:${PORT:-9009}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["7"]
              capabilities: [gpu]
    volumes:
      - ./assets:/app/assets
      - ./checkpoints:/app/checkpoints
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${PORT}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15m
